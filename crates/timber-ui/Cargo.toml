[package]
name = "timber-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
timber-core = { path = "../timber-core" }
leptos = { version = "0.8.22", features = ["csr"] }
wasm-bindgen = "0.2.104"
wasm-bindgen-futures = "0.4.54"
js-sys = "0.3.81"
console_error_panic_hook = "0.1.7"

[dependencies.web-sys]
version = "0.3.81"
features = [
    "AddEventListenerOptions",
    "Blob",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "DataTransfer",
    "Document",
    "DomRect",
    "DragEvent",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "MediaQueryList",
    "MediaQueryListEvent",
    "MouseEvent",
    "PointerEvent",
    "Storage",
    "TextMetrics",
    "Url",
    "WheelEvent",
    "Clipboard",
    "HtmlCollection",
    "Navigator",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "Window",
]
