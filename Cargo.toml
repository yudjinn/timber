[workspace]
resolver = "3"
members = ["crates/timber-core", "crates/timber-ui", "crates/timber-desktop", "crates/timber-csp"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/yudjinn/timber"

[profile.release]
lto = true

[profile.release.package.timber-ui]
opt-level = "s"
