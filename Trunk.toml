[build]
target = "crates/timber-ui/index.html"
dist = "dist"

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = false
# Cache, but check with the server on every load (an unchanged file is a 304), so the
# desktop webview never runs an old build (D-036).
headers = { "Cache-Control" = "no-cache" }
