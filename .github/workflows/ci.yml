# Tests on every push to main and every pull request (D-037). Also run by release.yml
# before building.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The kernel the kernel-backed tests run against (fetched sparsely, cached).
  KERNEL_TAG: v7.2

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages (webview, dtc, sshd)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev device-tree-compiler openssh-server
      # tauri-build wants frontendDist to exist; the UI itself is tested in the ui job.
      - name: Placeholder dist/
        shell: bash
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (wasm UI)
        if: runner.os == 'Linux'
        run: cargo clippy -p timber-ui --target wasm32-unknown-unknown -- -D warnings
      - name: Test
        run: cargo test --workspace

  ui:
    name: UI (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22
      - name: dtc
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler
      - name: Kernel cache
        uses: actions/cache@v4
        with:
          path: ~/linux
          key: kernel-${{ env.KERNEL_TAG }}
      - name: Kernel
        run: .github/scripts/fetch-kernel.sh "$KERNEL_TAG" ~/linux
      - name: Build the web UI
        run: trunk build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json
      - name: Playwright
        working-directory: tests/ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
          TIMBER_KERNEL_DIR=~/linux npx playwright test
      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/ui/playwright-report
            tests/ui/test-results
          retention-days: 7
